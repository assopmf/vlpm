# Publication d'une version à chaque étiquette (git tag v1.2.3) : exécutables
# serveur des six plateformes et application Android, joints à la release.
name: Publication

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # nécessaire pour créer la release et y joindre les fichiers

jobs:
  serveur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Tests
        run: go test -timeout 5m ./...

      - name: Compilation des six plateformes
        run: make dist VERSION=${GITHUB_REF_NAME}

      - uses: actions/upload-artifact@v4
        with:
          name: serveur
          path: dist/vlpm-*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Le trousseau de publication vit dans les secrets du dépôt, encodé en
      # base64. Il n'est jamais écrit ailleurs que dans le répertoire temporaire
      # de l'exécution.
      - name: Récupération du trousseau
        id: trousseau
        env:
          TROUSSEAU_BASE64: ${{ secrets.VLPM_TROUSSEAU_BASE64 }}
        run: |
          if [ -n "$TROUSSEAU_BASE64" ]; then
            echo "$TROUSSEAU_BASE64" | base64 -d > "$RUNNER_TEMP/vlpm.jks"
            echo "chemin=$RUNNER_TEMP/vlpm.jks" >> "$GITHUB_OUTPUT"
            echo "nom=vlpm-android.apk" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Aucun trousseau fourni : l'APK sera signé avec une clé de débogage éphémère et publié comme version d'essai."
            echo "chemin=" >> "$GITHUB_OUTPUT"
            echo "nom=vlpm-android-essai.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilation de l'APK
        working-directory: android
        env:
          VLPM_TROUSSEAU: ${{ steps.trousseau.outputs.chemin }}
          VLPM_TROUSSEAU_MOT_DE_PASSE: ${{ secrets.VLPM_TROUSSEAU_MOT_DE_PASSE }}
          VLPM_TROUSSEAU_ALIAS: ${{ secrets.VLPM_TROUSSEAU_ALIAS }}
          VLPM_CLE_MOT_DE_PASSE: ${{ secrets.VLPM_CLE_MOT_DE_PASSE }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # versionCode doit croître strictement d'une version à l'autre :
          # 1.2.3 donne 10203, ce qui laisse 99 correctifs par mineure.
          IFS=. read -r majeur mineur correctif <<< "${version%%-*}"
          code=$(( ${majeur:-0} * 10000 + ${mineur:-0} * 100 + ${correctif:-0} ))
          ./gradlew assembleRelease --no-daemon \
            -PversionName="$version" -PversionCode="$code"
          cp app/build/outputs/apk/release/app-release.apk \
             "$GITHUB_WORKSPACE/${{ steps.trousseau.outputs.nom }}"

      - name: Effacement du trousseau
        if: always()
        run: rm -f "$RUNNER_TEMP/vlpm.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: vlpm-android*.apk

  release:
    needs: [serveur, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: fichiers
          merge-multiple: true

      - name: Empreintes
        working-directory: fichiers
        run: sha256sum * > SHA256SUMS

      - name: Création de la release
        uses: softprops/action-gh-release@v2
        with:
          files: fichiers/*
          body: |
            ## Serveur

            Téléchargez l'exécutable correspondant à votre machine, rendez-le
            exécutable (`chmod +x`) et lancez-le. Aucune installation, aucune
            base de données à configurer.

            | Système | Fichier |
            |---|---|
            | Linux (VPS, serveur x86) | `vlpm-linux-amd64` |
            | Linux ARM (Raspberry Pi 4/5) | `vlpm-linux-arm64` |
            | Raspberry Pi plus ancien | `vlpm-linux-arm` |
            | macOS (Apple Silicon) | `vlpm-darwin-arm64` |
            | macOS (Intel) | `vlpm-darwin-amd64` |
            | Windows | `vlpm-windows-amd64.exe` |

            ## Application Android

            `vlpm-android.apk` s'installe directement sur le téléphone. Android
            demandera d'autoriser l'installation depuis une source inconnue :
            c'est normal pour une application distribuée hors magasin.

            **Si le fichier s'appelle `vlpm-android-essai.apk`**, il est signé
            avec une clé temporaire : il sert à essayer l'application, pas à
            équiper un service. Aucune version ultérieure ne pourra s'installer
            par-dessus sans le désinstaller, ce qui effacerait les saisies non
            transmises.

            ## Vérification

            Contrôlez l'empreinte du fichier téléchargé avec `SHA256SUMS`.

            Voir le [README](https://github.com/assopmf/vlpm#readme) pour
            l'installation en service et la mise en production.
